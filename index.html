<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Il mio mondo</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #82c9f5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #82c9f5;
    }

    #game {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 20px;
      left: 22px;
      margin: 0;
      color: rgba(255, 255, 255, 0.95);
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 4px rgba(17, 64, 34, 0.45);
    }

    .help {
      position: absolute;
      right: 22px;
      top: 20px;
      margin: 0;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: rgba(25, 92, 61, 0.42);
      font-size: 0.82rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
    }

    #startScreen {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(rgba(19, 65, 100, 0.2), rgba(19, 65, 100, 0.38));
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #startScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      width: min(420px, 100%);
      padding: 30px 26px 26px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      background: rgba(20, 66, 79, 0.72);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
      text-align: center;
      backdrop-filter: blur(7px);
    }

    .start-card h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
    }

    .start-card p {
      margin: 0 0 22px;
      color: rgba(255, 255, 255, 0.86);
      line-height: 1.5;
    }

    #startButton {
      min-width: 190px;
      padding: 14px 25px;
      border: 0;
      border-radius: 999px;
      background: #f6ca35;
      color: #173a2b;
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      letter-spacing: 0.06em;
      box-shadow: 0 5px 0 #b28612;
    }

    #startButton:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b28612;
    }

    #touchControls {
      display: none;
      position: fixed;
      z-index: 4;
      inset: 0;
      pointer-events: none;
    }

    #joystick {
      position: absolute;
      left: 24px;
      bottom: 28px;
      width: 124px;
      height: 124px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(23, 76, 72, 0.28);
      pointer-events: auto;
      touch-action: none;
    }

    #joystickKnob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 53px;
      height: 53px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transform: translate(-50%, -50%);
    }

    #lookArea {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 58%;
      height: 65%;
      pointer-events: auto;
      touch-action: none;
    }

    .touch-label {
      position: absolute;
      bottom: 12px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .touch-label.left {
      left: 43px;
    }

    .touch-label.right {
      right: 28px;
    }

    @media (pointer: coarse) and (max-width: 700px) {
      .help {
        display: none;
      }

      .title {
        top: 14px;
        left: 16px;
      }

      #touchControls {
        display: block;
      }

      .crosshair {
        width: 8px;
        height: 8px;
      }
    }

    @media (pointer: fine) {
      #touchControls {
        display: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="game" aria-label="Mondo 3D giocabile"></div>

  <div class="hud" aria-hidden="true">
    <p class="title">IL MIO MONDO</p>
    <p class="help">WASD / frecce · mouse per guardarti intorno</p>
    <div class="crosshair"></div>
  </div>

  <div id="touchControls" aria-hidden="true">
    <div id="joystick"><div id="joystickKnob"></div></div>
    <div id="lookArea"></div>
    <span class="touch-label left">muovi</span>
    <span class="touch-label right">guarda</span>
  </div>

  <section id="startScreen">
    <div class="start-card">
      <h1>Benvenuto nel mondo</h1>
      <p>Colline, prati e rocce generate in tempo reale.<br>Entra ed esplora il terreno.</p>
      <button id="startButton" type="button">INIZIA</button>
    </div>
  </section>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const game = document.getElementById("game");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const joystick = document.getElementById("joystick");
    const joystickKnob = document.getElementById("joystickKnob");
    const lookArea = document.getElementById("lookArea");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x83c9f4);
    scene.fog = new THREE.Fog(0x83c9f4, 48, 185);

    const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(0, 1.7, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    game.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xd9f4ff, 0x5a863e, 2.1);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff4d6, 3.2);
    sun.position.set(-35, 48, 22);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -70;
    sun.shadow.camera.right = 70;
    sun.shadow.camera.top = 70;
    sun.shadow.camera.bottom = -70;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 150;
    scene.add(sun);

    // Terreno procedurale a chunk: l'altezza dipende sempre dalle coordinate globali.
    // Questo mantiene i bordi dei quadranti coincidenti, come nel vecchio sistema Java,
    // senza dover correggere manualmente le cuciture tra un quadrante e l'altro.
    // Terreno procedurale a chunk: l'altezza dipende dalle coordinate globali.
    // I profili vengono interpolati tra i vertici della griglia dei chunk, così
    // ogni area ha caratteristiche diverse senza creare scalini ai bordi.
    const TERRAIN = {
      chunkSize: 64,
      segments: 32,
      loadRadius: 2,
      verticalScale: 10,
      seed: 270827
    };
    const TERRAIN_PROFILES = [
      { name: "pianura", amplitude: 0.55, detail: 0.12, ridge: 0.02, grass: 0x6dbb5a },
      { name: "leggermente mosso", amplitude: 2.5, detail: 0.55, ridge: 0.18, grass: 0x5ba64d },
      { name: "scosceso", amplitude: 5.4, detail: 1.15, ridge: 1.2, grass: 0x4a8d43 },
      { name: "montagna", amplitude: 9.5, detail: 1.8, ridge: 3.7, grass: 0x668a60 }
    ];
    const terrainChunks = new Map();

    function hash2D(x, z) {
      let h = Math.imul(x, 374761393) ^ Math.imul(z, 668265263) ^ Math.imul(TERRAIN.seed, 1442695041);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }

    function smooth(t) {
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function valueNoise(x, z) {
      const x0 = Math.floor(x);
      const z0 = Math.floor(z);
      const tx = smooth(x - x0);
      const tz = smooth(z - z0);
      const n00 = hash2D(x0, z0);
      const n10 = hash2D(x0 + 1, z0);
      const n01 = hash2D(x0, z0 + 1);
      const n11 = hash2D(x0 + 1, z0 + 1);
      return lerp(lerp(n00, n10, tx), lerp(n01, n11, tx), tz);
    }

    function fractalNoise(x, z, octaves = 5) {
      let sum = 0;
      let amplitude = 1;
      let frequency = 1;
      let weight = 0;
      for (let octave = 0; octave < octaves; octave++) {
        sum += valueNoise(x * frequency, z * frequency) * amplitude;
        weight += amplitude;
        amplitude *= 0.5;
        frequency *= 2;
      }
      return sum / weight;
    }

    function profileAtNode(chunkX, chunkZ) {
      const choice = Math.min(
        TERRAIN_PROFILES.length - 1,
        Math.floor(hash2D(chunkX * 37 + 11, chunkZ * 37 - 19) * TERRAIN_PROFILES.length)
      );
      const source = TERRAIN_PROFILES[choice];
      const variation = 0.84 + hash2D(chunkX * 53 - 7, chunkZ * 53 + 23) * 0.32;
      return {
        name: source.name,
        amplitude: source.amplitude * variation,
        detail: source.detail * variation,
        ridge: source.ridge * variation,
        grass: source.grass
      };
    }

    function mixProfile(a, b, t) {
      return {
        name: t < 0.5 ? a.name : b.name,
        amplitude: lerp(a.amplitude, b.amplitude, t),
        detail: lerp(a.detail, b.detail, t),
        ridge: lerp(a.ridge, b.ridge, t),
        grass: new THREE.Color(a.grass).lerp(new THREE.Color(b.grass), t)
      };
    }

    function terrainProfileAt(x, z) {
      const gridX = x / TERRAIN.chunkSize;
      const gridZ = z / TERRAIN.chunkSize;
      const x0 = Math.floor(gridX);
      const z0 = Math.floor(gridZ);
      const tx = smooth(gridX - x0);
      const tz = smooth(gridZ - z0);
      const p00 = profileAtNode(x0, z0);
      const p10 = profileAtNode(x0 + 1, z0);
      const p01 = profileAtNode(x0, z0 + 1);
      const p11 = profileAtNode(x0 + 1, z0 + 1);
      const px0 = mixProfile(p00, p10, tx);
      const px1 = mixProfile(p01, p11, tx);
      return mixProfile(px0, px1, tz);
    }

    function heightAt(x, z) {
      const profile = terrainProfileAt(x, z);
      const broad = fractalNoise(x * 0.012, z * 0.012, 5);
      const detail = fractalNoise(x * 0.045 + 17.3, z * 0.045 - 9.1, 4);
      const ridgeNoise = fractalNoise(x * 0.02 - 41.7, z * 0.02 + 28.4, 4);
      const ridge = 1 - Math.abs(ridgeNoise * 2 - 1);
      const baseHeight = (broad - 0.5) * profile.amplitude
        + (detail - 0.5) * profile.detail
        + (ridge - 0.5) * profile.ridge;
      return baseHeight * TERRAIN.verticalScale;
    }

    function terrainColor(height, slope, x, z) {
      const profile = terrainProfileAt(x, z);
      const color = new THREE.Color(profile.grass);
      const variation = (valueNoise(x * 0.08 + 73, z * 0.08 - 31) - 0.5) * 0.12;
      const surfaceNoise = valueNoise(x * 0.055 - 91, z * 0.055 + 47);
      const rockLine = 1.2 + profile.amplitude * 0.17;

      if (slope > 1.05 || height > rockLine) {
        color.setRGB(0.36 + variation, 0.37 + variation, 0.35 + variation);
      } else if (height < -1.35 && surfaceNoise > 0.28) {
        color.setRGB(0.76 + variation, 0.65 + variation, 0.39 + variation);
      } else if (surfaceNoise > 0.79 || (slope > 0.55 && surfaceNoise > 0.56)) {
        color.setRGB(0.47 + variation, 0.32 + variation, 0.19 + variation);
      } else {
        color.offsetHSL(0, variation * 0.18, variation);
      }
      return color;
    }

    function createTerrainChunk(chunkX, chunkZ) {
      const size = TERRAIN.chunkSize;
      const segments = TERRAIN.segments;
      const half = size * 0.5;
      const worldOriginX = chunkX * size + half;
      const worldOriginZ = chunkZ * size + half;
      const positions = [];
      const colors = [];
      const indices = [];
      const step = size / segments;

      for (let row = 0; row <= segments; row++) {
        for (let column = 0; column <= segments; column++) {
          const localX = -half + column * step;
          const localZ = -half + row * step;
          const worldX = worldOriginX + localX;
          const worldZ = worldOriginZ + localZ;
          const height = heightAt(worldX, worldZ);
          const slope = Math.max(
            Math.abs(heightAt(worldX + 1, worldZ) - heightAt(worldX - 1, worldZ)),
            Math.abs(heightAt(worldX, worldZ + 1) - heightAt(worldX, worldZ - 1))
          );
          const color = terrainColor(height, slope, worldX, worldZ);
          positions.push(localX, height, localZ);
          colors.push(color.r, color.g, color.b);
        }
      }

      for (let row = 0; row < segments; row++) {
        for (let column = 0; column < segments; column++) {
          const a = row * (segments + 1) + column;
          const b = a + 1;
          const d = (row + 1) * (segments + 1) + column;
          const c = d + 1;
          indices.push(a, d, b, b, d, c);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 1,
          metalness: 0
        })
      );
      mesh.position.set(worldOriginX, 0, worldOriginZ);
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function chunkKey(chunkX, chunkZ) {
      return chunkX + "," + chunkZ;
    }

    function syncTerrainChunks() {
      const centerX = Math.floor(camera.position.x / TERRAIN.chunkSize);
      const centerZ = Math.floor(camera.position.z / TERRAIN.chunkSize);
      const needed = new Set();

      for (let dz = -TERRAIN.loadRadius; dz <= TERRAIN.loadRadius; dz++) {
        for (let dx = -TERRAIN.loadRadius; dx <= TERRAIN.loadRadius; dx++) {
          const chunkX = centerX + dx;
          const chunkZ = centerZ + dz;
          const key = chunkKey(chunkX, chunkZ);
          needed.add(key);
          if (!terrainChunks.has(key)) {
            terrainChunks.set(key, createTerrainChunk(chunkX, chunkZ));
          }
        }
      }

      for (const [key, mesh] of terrainChunks) {
        if (!needed.has(key)) {
          scene.remove(mesh);
          mesh.geometry.dispose();
          mesh.material.dispose();
          terrainChunks.delete(key);
        }
      }
    }

    syncTerrainChunks();
    camera.position.y = heightAt(camera.position.x, camera.position.z) + 1.7;

    function createTree(x, z, scale = 1) {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.18 * scale, 0.24 * scale, 1.8 * scale, 8),
        new THREE.MeshStandardMaterial({ color: 0x70492e, roughness: 1 })
      );
      trunk.position.y = 0.9 * scale;
      trunk.castShadow = true;
      tree.add(trunk);

      const leaves = new THREE.Mesh(
        new THREE.DodecahedronGeometry(1.2 * scale, 1),
        new THREE.MeshStandardMaterial({ color: 0x2d7e3c, roughness: 1 })
      );
      leaves.position.y = 2.25 * scale;
      leaves.castShadow = true;
      tree.add(leaves);
      tree.position.set(x, heightAt(x, z), z);
      scene.add(tree);
    }

    createTree(-18, -29, 1.7);
    createTree(21, -36, 2.1);
    createTree(-32, -52, 2.7);
    createTree(34, -66, 3.1);
    createTree(-55, -84, 3.8);
    createTree(61, -94, 4.2);

    function createCloud(x, y, z, scale = 1) {
      const cloud = new THREE.Group();
      const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.84 });
      const parts = [
        [-1.5, 0, 0, 1.25],
        [0, 0.25, 0, 1.6],
        [1.55, 0, 0.1, 1.1],
        [0.65, -0.15, 0.35, 1.25]
      ];
      for (const [px, py, pz, size] of parts) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(size * scale, 16, 12), material);
        puff.position.set(px * scale, py * scale, pz * scale);
        cloud.add(puff);
      }
      cloud.position.set(x, y, z);
      scene.add(cloud);
    }

    createCloud(-27, 21, -70, 2.2);
    createCloud(32, 25, -105, 2.7);
    createCloud(2, 30, -145, 3.2);

    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    let started = false;
    const clock = new THREE.Clock();
    const mobileMove = { x: 0, y: 0 };
    let joystickPointer = null;
    let lookPointer = null;
    let previousLookX = 0;
    let previousLookY = 0;
    let mouseLookPointer = null;

    function enterImmersiveMode() {
      // Il fullscreen non viene più richiesto automaticamente.
      // Sul desktop il click prova solo ad attivare il pointer lock.
      if (matchMedia("(pointer: fine)").matches && document.pointerLockElement !== renderer.domElement) {
        renderer.domElement.requestPointerLock?.();
      }
    }

    function beginGame() {
      started = true;
      startScreen.classList.add("hidden");
      enterImmersiveMode();
    }

    startButton.addEventListener("click", beginGame);
    renderer.domElement.addEventListener("click", () => {
      if (!started) {
        beginGame();
      } else if (matchMedia("(pointer: fine)").matches && document.pointerLockElement !== renderer.domElement) {
        renderer.domElement.requestPointerLock?.();
      }
    });

    addEventListener("keydown", event => {
      keys.add(event.key.toLowerCase());
      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });
    addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));

    addEventListener("mousemove", event => {
      if (document.pointerLockElement !== renderer.domElement || !started) return;
      yaw -= event.movementX * 0.0022;
      pitch -= event.movementY * 0.0022;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
    });

    renderer.domElement.addEventListener("pointerdown", event => {
      if (!started || !matchMedia("(pointer: fine)").matches) return;
      mouseLookPointer = event.pointerId;
      previousLookX = event.clientX;
      previousLookY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      // Fallback per browser che non consentono il pointer lock:
      // clicca e trascina sul canvas per guardarti intorno.
      if (!started || event.pointerId !== mouseLookPointer || document.pointerLockElement === renderer.domElement) return;
      yaw -= (event.clientX - previousLookX) * 0.006;
      pitch -= (event.clientY - previousLookY) * 0.006;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
      previousLookX = event.clientX;
      previousLookY = event.clientY;
    });

    function stopMouseLooking(event) {
      if (event.pointerId !== mouseLookPointer) return;
      mouseLookPointer = null;
      if (renderer.domElement.hasPointerCapture?.(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", stopMouseLooking);
    renderer.domElement.addEventListener("pointercancel", stopMouseLooking);

    function updateJoystick(event) {
      const rect = joystick.getBoundingClientRect();
      const radius = rect.width * 0.5;
      let dx = event.clientX - (rect.left + radius);
      let dy = event.clientY - (rect.top + radius);
      const distance = Math.hypot(dx, dy);
      if (distance > radius) {
        dx = dx / distance * radius;
        dy = dy / distance * radius;
      }
      mobileMove.x = dx / radius;
      mobileMove.y = dy / radius;
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function resetJoystick() {
      joystickPointer = null;
      mobileMove.x = 0;
      mobileMove.y = 0;
      joystickKnob.style.transform = "translate(-50%, -50%)";
    }

    joystick.addEventListener("pointerdown", event => {
      if (!started) beginGame();
      joystickPointer = event.pointerId;
      joystick.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });
    joystick.addEventListener("pointermove", event => {
      if (event.pointerId === joystickPointer) updateJoystick(event);
    });
    joystick.addEventListener("pointerup", resetJoystick);
    joystick.addEventListener("pointercancel", resetJoystick);

    lookArea.addEventListener("pointerdown", event => {
      if (!started) beginGame();
      lookPointer = event.pointerId;
      previousLookX = event.clientX;
      previousLookY = event.clientY;
      lookArea.setPointerCapture(event.pointerId);
    });
    lookArea.addEventListener("pointermove", event => {
      if (event.pointerId !== lookPointer) return;
      yaw -= (event.clientX - previousLookX) * 0.009;
      pitch -= (event.clientY - previousLookY) * 0.009;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
      previousLookX = event.clientX;
      previousLookY = event.clientY;
    });
    function stopLooking(event) {
      if (event.pointerId === lookPointer) lookPointer = null;
    }
    lookArea.addEventListener("pointerup", stopLooking);
    lookArea.addEventListener("pointercancel", stopLooking);

    function movePlayer(delta) {
      if (!started) return;

      let forward = 0;
      let side = 0;
      if (keys.has("w") || keys.has("arrowup")) forward += 1;
      if (keys.has("s") || keys.has("arrowdown")) forward -= 1;
      if (keys.has("a") || keys.has("arrowleft")) side -= 1;
      if (keys.has("d") || keys.has("arrowright")) side += 1;
      if (Math.abs(mobileMove.x) > 0.05 || Math.abs(mobileMove.y) > 0.05) {
        side = mobileMove.x;
        forward = -mobileMove.y;
      }

      const length = Math.hypot(forward, side);
      if (length > 1) {
        forward /= length;
        side /= length;
      }

      const speed = keys.has("shift") ? 12 : 7;
      const distance = speed * delta;
      const forwardX = -Math.sin(yaw);
      const forwardZ = -Math.cos(yaw);
      const rightX = Math.cos(yaw);
      const rightZ = -Math.sin(yaw);
      camera.position.x += (forwardX * forward + rightX * side) * distance;
      camera.position.z += (forwardZ * forward + rightZ * side) * distance;
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -256, 256);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -256, 256);
      syncTerrainChunks();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      movePlayer(delta);
      const targetHeight = heightAt(camera.position.x, camera.position.z) + 1.7;
      camera.position.y = THREE.MathUtils.lerp(camera.position.y, targetHeight, Math.min(1, delta * 10));
      camera.rotation.order = "YXZ";
      camera.rotation.y = yaw;
      camera.rotation.x = pitch;
      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
