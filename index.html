<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Il mio mondo</title>
  <style>
    :root {
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background: #82c9f5;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #82c9f5;
    }

    #game {
      position: fixed;
      inset: 0;
      touch-action: none;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    .title {
      position: absolute;
      top: 20px;
      left: 22px;
      margin: 0;
      color: rgba(255, 255, 255, 0.95);
      font-size: clamp(1rem, 2vw, 1.35rem);
      font-weight: 800;
      letter-spacing: 0.08em;
      text-shadow: 0 2px 4px rgba(17, 64, 34, 0.45);
    }

    .help {
      position: absolute;
      right: 22px;
      top: 20px;
      margin: 0;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 999px;
      background: rgba(25, 92, 61, 0.42);
      font-size: 0.82rem;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
    }

    .crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      border: 2px solid rgba(255, 255, 255, 0.92);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.5);
    }


    #startScreen {
      position: fixed;
      z-index: 5;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: linear-gradient(rgba(19, 65, 100, 0.2), rgba(19, 65, 100, 0.38));
      transition: opacity 180ms ease, visibility 180ms ease;
    }

    #startScreen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .start-card {
      width: min(420px, 100%);
      padding: 30px 26px 26px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      background: rgba(20, 66, 79, 0.72);
      box-shadow: 0 20px 55px rgba(0, 0, 0, 0.28);
      text-align: center;
      backdrop-filter: blur(7px);
    }

    .start-card h1 {
      margin: 0 0 10px;
      font-size: clamp(1.7rem, 5vw, 2.4rem);
    }

    .start-card p {
      margin: 0 0 22px;
      color: rgba(255, 255, 255, 0.86);
      line-height: 1.5;
    }

    #startButton {
      min-width: 190px;
      padding: 14px 25px;
      border: 0;
      border-radius: 999px;
      background: #f6ca35;
      color: #173a2b;
      cursor: pointer;
      font: inherit;
      font-weight: 900;
      letter-spacing: 0.06em;
      box-shadow: 0 5px 0 #b28612;
    }

    #startButton:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #b28612;
    }

    #touchControls {
      display: none;
      position: fixed;
      z-index: 4;
      inset: 0;
      pointer-events: none;
    }

    #joystick {
      position: absolute;
      left: 24px;
      bottom: 28px;
      width: 124px;
      height: 124px;
      border: 2px solid rgba(255, 255, 255, 0.45);
      border-radius: 50%;
      background: rgba(23, 76, 72, 0.28);
      pointer-events: auto;
      touch-action: none;
    }

    #joystickKnob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 53px;
      height: 53px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.25);
      transform: translate(-50%, -50%);
    }

    #lookArea {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 58%;
      height: 65%;
      pointer-events: auto;
      touch-action: none;
    }

    .touch-label {
      position: absolute;
      bottom: 12px;
      color: rgba(255, 255, 255, 0.62);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    }

    .touch-label.left {
      left: 43px;
    }

    .touch-label.right {
      right: 28px;
    }

    @media (pointer: coarse), (max-width: 700px) {
      .help {
        display: none;
      }

      .title {
        top: 14px;
        left: 16px;
      }

      #touchControls {
        display: block;
      }

      .crosshair {
        width: 8px;
        height: 8px;
      }
    }
  </style>
</head>
<body>
  <div id="game" aria-label="Mondo 3D giocabile"></div>

  <div class="hud" aria-hidden="true">
    <p class="title">11</p>
    <p class="help">WASD / frecce · mouse per pilotare e guardarti intorno</p>
    <div class="crosshair"></div>
  </div>

  <div id="touchControls" aria-hidden="true">
    <div id="joystick"><div id="joystickKnob"></div></div>
    <div id="lookArea"></div>
    <span class="touch-label left">premi = vola · su = spara</span>
    <span class="touch-label right">swipe / guarda</span>
  </div>

  <section id="startScreen">
    <div class="start-card">
      <h1>Benvenuto nel mondo</h1>
      <p>Asfalto, ghiaia, terra, cemento e poca erba.<br>Vola tra i grattacieli della città.</p>
      <button id="startButton" type="button">INIZIA</button>
    </div>
  </section>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const game = document.getElementById("game");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const joystick = document.getElementById("joystick");
    const joystickKnob = document.getElementById("joystickKnob");
    const lookArea = document.getElementById("lookArea");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x83c9f4);
    scene.fog = new THREE.Fog(0x83c9f4, 48, 185);

    const camera = new THREE.PerspectiveCamera(74, innerWidth / innerHeight, 0.1, 300);
    camera.position.set(0, 1.7, 8);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    game.appendChild(renderer.domElement);

    const ambient = new THREE.HemisphereLight(0xd9f4ff, 0x5a863e, 2.1);
    scene.add(ambient);

    const sun = new THREE.DirectionalLight(0xfff4d6, 3.2);
    sun.position.set(-35, 48, 22);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -70;
    sun.shadow.camera.right = 70;
    sun.shadow.camera.top = 70;
    sun.shadow.camera.bottom = -70;
    sun.shadow.camera.near = 1;
    sun.shadow.camera.far = 150;
    scene.add(sun);

    // Terreno procedurale a chunk: l'altezza dipende sempre dalle coordinate globali.
    // Questo mantiene i bordi dei quadranti coincidenti, come nel vecchio sistema Java,
    // senza dover correggere manualmente le cuciture tra un quadrante e l'altro.
    // Terreno procedurale a chunk: l'altezza dipende dalle coordinate globali.
    // I profili vengono interpolati tra i vertici della griglia dei chunk, così
    // ogni area ha caratteristiche diverse senza creare scalini ai bordi.
    const TERRAIN = {
      chunkSize: 64,
      segments: 32,
      loadRadius: 2,
      verticalScale: 0.2,
      seed: 270827
    };
    const TERRAIN_PROFILES = [
      { name: "pianura", amplitude: 0.55, detail: 0.12, ridge: 0.02, grass: 0x6dbb5a },
      { name: "leggermente mosso", amplitude: 2.5, detail: 0.55, ridge: 0.18, grass: 0x5ba64d },
      { name: "scosceso", amplitude: 5.4, detail: 1.15, ridge: 1.2, grass: 0x4a8d43 },
      { name: "montagna", amplitude: 9.5, detail: 1.8, ridge: 3.7, grass: 0x668a60 }
    ];
    const terrainChunks = new Map();
    const structureChunks = new Map();
    const buildingHitboxes = new Map();
    const flyerHitboxRadius = 0.38;
    const projectiles = [];
    let shotCooldown = 0;
    let flyer = null;
    const BUILDING_MATERIALS = {
      facades: [
        new THREE.MeshStandardMaterial({ color: 0x6d7378, roughness: 0.82, metalness: 0.08 }),
        new THREE.MeshStandardMaterial({ color: 0x39444c, roughness: 0.7, metalness: 0.18 }),
        new THREE.MeshStandardMaterial({ color: 0x8b8f8c, roughness: 0.9, metalness: 0.04 }),
        new THREE.MeshStandardMaterial({ color: 0x26343d, roughness: 0.62, metalness: 0.24 })
      ],
      glass: new THREE.MeshStandardMaterial({
        color: 0x35677a,
        roughness: 0.28,
        metalness: 0.32
      }),
      windows: new THREE.MeshStandardMaterial({
        color: 0xffc967,
        emissive: 0x5a3510,
        emissiveIntensity: 0.8,
        roughness: 0.42,
        metalness: 0.12
      }),
      roof: new THREE.MeshStandardMaterial({ color: 0x1c242a, roughness: 0.65, metalness: 0.35 }),
      concrete: new THREE.MeshStandardMaterial({ color: 0x555b5d, roughness: 1, metalness: 0.05 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x182128, roughness: 0.72, metalness: 0.22 })
    };

    // Le linee di debug sono indipendenti: i materiali dei palazzi restano sempre opachi.
    for (const materialGroup of Object.values(BUILDING_MATERIALS)) {
      const materials = Array.isArray(materialGroup) ? materialGroup : [materialGroup];
      for (const material of materials) {
        material.transparent = false;
        material.opacity = 1;
        material.depthWrite = true;
      }
    }

    function hash2D(x, z) {
      let h = Math.imul(x, 374761393) ^ Math.imul(z, 668265263) ^ Math.imul(TERRAIN.seed, 1442695041);
      h = Math.imul(h ^ (h >>> 13), 1274126177);
      return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
    }

    function smooth(t) {
      return t * t * (3 - 2 * t);
    }

    function lerp(a, b, t) {
      return a + (b - a) * t;
    }

    function valueNoise(x, z) {
      const x0 = Math.floor(x);
      const z0 = Math.floor(z);
      const tx = smooth(x - x0);
      const tz = smooth(z - z0);
      const n00 = hash2D(x0, z0);
      const n10 = hash2D(x0 + 1, z0);
      const n01 = hash2D(x0, z0 + 1);
      const n11 = hash2D(x0 + 1, z0 + 1);
      return lerp(lerp(n00, n10, tx), lerp(n01, n11, tx), tz);
    }

    function fractalNoise(x, z, octaves = 5) {
      let sum = 0;
      let amplitude = 1;
      let frequency = 1;
      let weight = 0;
      for (let octave = 0; octave < octaves; octave++) {
        sum += valueNoise(x * frequency, z * frequency) * amplitude;
        weight += amplitude;
        amplitude *= 0.5;
        frequency *= 2;
      }
      return sum / weight;
    }

    function profileAtNode(chunkX, chunkZ) {
      const choice = Math.min(
        TERRAIN_PROFILES.length - 1,
        Math.floor(hash2D(chunkX * 37 + 11, chunkZ * 37 - 19) * TERRAIN_PROFILES.length)
      );
      const source = TERRAIN_PROFILES[choice];
      const variation = 0.84 + hash2D(chunkX * 53 - 7, chunkZ * 53 + 23) * 0.32;
      return {
        name: source.name,
        amplitude: source.amplitude * variation,
        detail: source.detail * variation,
        ridge: source.ridge * variation,
        grass: source.grass
      };
    }

    function mixProfile(a, b, t) {
      return {
        name: t < 0.5 ? a.name : b.name,
        amplitude: lerp(a.amplitude, b.amplitude, t),
        detail: lerp(a.detail, b.detail, t),
        ridge: lerp(a.ridge, b.ridge, t),
        grass: new THREE.Color(a.grass).lerp(new THREE.Color(b.grass), t)
      };
    }

    function terrainProfileAt(x, z) {
      const gridX = x / TERRAIN.chunkSize;
      const gridZ = z / TERRAIN.chunkSize;
      const x0 = Math.floor(gridX);
      const z0 = Math.floor(gridZ);
      const tx = smooth(gridX - x0);
      const tz = smooth(gridZ - z0);
      const p00 = profileAtNode(x0, z0);
      const p10 = profileAtNode(x0 + 1, z0);
      const p01 = profileAtNode(x0, z0 + 1);
      const p11 = profileAtNode(x0 + 1, z0 + 1);
      const px0 = mixProfile(p00, p10, tx);
      const px1 = mixProfile(p01, p11, tx);
      return mixProfile(px0, px1, tz);
    }

    function heightAt(x, z) {
      const profile = terrainProfileAt(x, z);
      const broad = fractalNoise(x * 0.012, z * 0.012, 5);
      const detail = fractalNoise(x * 0.045 + 17.3, z * 0.045 - 9.1, 4);
      const ridgeNoise = fractalNoise(x * 0.02 - 41.7, z * 0.02 + 28.4, 4);
      const ridge = 1 - Math.abs(ridgeNoise * 2 - 1);
      const baseHeight = (broad - 0.5) * profile.amplitude
        + (detail - 0.5) * profile.detail
        + (ridge - 0.5) * profile.ridge;
      return baseHeight * TERRAIN.verticalScale;
    }

    function terrainColor(height, slope, x, z) {
      // Superficie urbana: l'asfalto è dominante, con chiazze determinate
      // sempre dalle coordinate globali per restare identica quando il chunk viene ricreato.
      const asphalt = new THREE.Color(0x4b4f50);
      const gravel = new THREE.Color(0x9a958c);
      const dirt = new THREE.Color(0x76523b);
      const concrete = new THREE.Color(0x858887);
      const grass = new THREE.Color(0x6d874f);
      const patch = valueNoise(x * 0.035 + 41, z * 0.035 - 17);
      const detail = valueNoise(x * 0.13 - 83, z * 0.13 + 29);
      const variation = (detail - 0.5) * 0.12;
      let color;

      if (slope > 1.15) {
        color = concrete;
      } else if (patch < 0.5) {
        color = asphalt;
      } else if (patch < 0.72) {
        color = gravel;
      } else if (patch < 0.9) {
        color = dirt;
      } else if (patch < 0.965) {
        color = concrete;
      } else {
        // Erba rara: resta una presenza secondaria nell'ambiente urbano.
        color = grass;
      }

      color = color.clone();
      color.offsetHSL(0, 0, variation);
      return color;
    }

    function seededRandom(chunkX, chunkZ, slot) {
      return hash2D(
        chunkX * 97 + slot * 31 + 13,
        chunkZ * 89 - slot * 47 - 7
      );
    }

    function groundVariation(x, z, width, depth) {
      const samples = [
        heightAt(x - width * 0.45, z - depth * 0.45),
        heightAt(x + width * 0.45, z - depth * 0.45),
        heightAt(x - width * 0.45, z + depth * 0.45),
        heightAt(x + width * 0.45, z + depth * 0.45)
      ];
      return Math.max(...samples) - Math.min(...samples);
    }

    function addSkyscraperDetails(group, width, depth, wallHeight, variant) {
      const bandCount = Math.max(3, Math.floor(wallHeight / 5));
      for (let level = 1; level < bandCount; level++) {
        const y = 0.45 + (wallHeight * level) / bandCount;
        const band = new THREE.Mesh(
          new THREE.BoxGeometry(width + 0.05, 0.18, depth + 0.05),
          level % 3 === variant % 3 ? BUILDING_MATERIALS.windows : BUILDING_MATERIALS.glass
        );
        band.position.y = y;
        group.add(band);
      }

      const frontGlass = new THREE.Mesh(
        new THREE.BoxGeometry(width * 0.62, wallHeight * 0.82, 0.06),
        BUILDING_MATERIALS.glass
      );
      frontGlass.position.set(0, 0.5 + wallHeight * 0.5, depth * 0.5 + 0.04);
      group.add(frontGlass);

      const sideGlass = new THREE.Mesh(
        new THREE.BoxGeometry(0.06, wallHeight * 0.68, depth * 0.52),
        BUILDING_MATERIALS.glass
      );
      sideGlass.position.set(width * 0.5 + 0.04, 0.5 + wallHeight * 0.53, 0);
      group.add(sideGlass);
    }

    function createBuilding(x, z, kind, scale, facadeIndex) {
      const group = new THREE.Group();
      const baseY = heightAt(x, z);
      const facade = BUILDING_MATERIALS.facades[facadeIndex];

      const width = kind === 1 ? 6 + scale * 2.6 : 8 + scale * 3.8;
      const depth = kind === 1 ? 6 + scale * 2.4 : 8 + scale * 3.4;
      let wallHeight;
      if (kind === 0) {
        wallHeight = 18 + scale * 18;
      } else if (kind === 1) {
        wallHeight = 30 + scale * 28;
      } else if (kind === 2) {
        wallHeight = 12 + scale * 14;
      } else {
        wallHeight = 42 + scale * 34;
      }

      // Fondamenta profonde: penetrano nel terreno e impediscono l'effetto edificio sospeso.
      const foundationDepth = 2.6;
      const foundationTop = 0.18;
      const foundation = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.9, foundationDepth, depth + 0.9),
        BUILDING_MATERIALS.concrete
      );
      foundation.position.y = foundationTop - foundationDepth * 0.5;
      foundation.castShadow = true;
      foundation.receiveShadow = true;
      group.add(foundation);

      const tower = new THREE.Mesh(
        new THREE.BoxGeometry(width, wallHeight, depth),
        facade
      );
      tower.position.y = foundationTop + wallHeight * 0.5;
      tower.castShadow = true;
      tower.receiveShadow = true;
      group.add(tower);

      addSkyscraperDetails(group, width, depth, wallHeight, facadeIndex);

      // Tetto piatto tecnico, senza sagome da casa.
      const roof = new THREE.Mesh(
        new THREE.BoxGeometry(width + 0.18, 0.34, depth + 0.18),
        BUILDING_MATERIALS.roof
      );
      roof.position.y = foundationTop + wallHeight + 0.17;
      roof.castShadow = true;
      group.add(roof);

      if (kind === 1 || kind === 3) {
        const antenna = new THREE.Mesh(
          new THREE.CylinderGeometry(0.09, 0.16, 3 + scale * 3, 6),
          BUILDING_MATERIALS.dark
        );
        antenna.position.y = roof.position.y + 1.7 + scale * 1.5;
        antenna.castShadow = true;
        group.add(antenna);
      }

      if (kind === 2) {
        const podium = new THREE.Mesh(
          new THREE.BoxGeometry(width * 1.18, 3.2, depth * 1.18),
          BUILDING_MATERIALS.concrete
        );
        podium.position.y = foundationTop + 1.6;
        podium.castShadow = true;
        podium.receiveShadow = true;
        group.add(podium);
      }

      group.position.set(x, baseY, z);

      // La hitbox aderisce al corpo lungo della torre: esclude la fondazione
      // più larga e parte dal piano di appoggio del corpo, senza lasciare gap.
      group.updateMatrixWorld(true);
      const bodyBottom = baseY + foundationTop;
      const bodyTop = bodyBottom + wallHeight;
      const roofTop = bodyTop + 0.34;
      const hitboxTop = roofTop + 0.08;
      group.userData.hitbox = new THREE.Box3(
        new THREE.Vector3(x - width * 0.5, bodyBottom, z - depth * 0.5),
        new THREE.Vector3(x + width * 0.5, hitboxTop, z + depth * 0.5)
      );
      return group;
    }

    function createStructuresChunk(chunkX, chunkZ) {
      const group = new THREE.Group();
      const chunkHitboxes = [];
      const count = 10 + Math.floor(seededRandom(chunkX, chunkZ, 0) * 7);
      const columns = 4;
      const rows = 4;

      for (let index = 0; index < count; index++) {
        const slot = index * 11 + 1;
        const column = index % columns;
        const row = Math.floor(index / columns) % rows;
        const jitterX = (seededRandom(chunkX, chunkZ, slot) - 0.5) * 4;
        const jitterZ = (seededRandom(chunkX, chunkZ, slot + 1) - 0.5) * 4;
        const localX = 6 + column * 15 + jitterX;
        const localZ = 6 + row * 15 + jitterZ;
        const kind = Math.floor(seededRandom(chunkX, chunkZ, slot + 2) * 4);
        const scale = 0.6 + seededRandom(chunkX, chunkZ, slot + 3) * 0.85;
        const width = kind === 1 ? 6 + scale * 2.6 : 8 + scale * 3.8;
        const depth = kind === 1 ? 6 + scale * 2.4 : 8 + scale * 3.4;
        const worldX = chunkX * TERRAIN.chunkSize + localX;
        const worldZ = chunkZ * TERRAIN.chunkSize + localZ;

        // Una piccola tolleranza evita edifici inclinati, mantenendo però la città compatta.
        if (groundVariation(worldX, worldZ, width, depth) > 1.2) continue;

        const building = createBuilding(
          worldX,
          worldZ,
          kind,
          scale,
          Math.floor(seededRandom(chunkX, chunkZ, slot + 4) * BUILDING_MATERIALS.facades.length)
        );
        group.add(building);

        chunkHitboxes.push(building.userData.hitbox);
      }

      buildingHitboxes.set(chunkKey(chunkX, chunkZ), chunkHitboxes);
      scene.add(group);
      return group;
    }

    function disposeStructureGroup(group) {
      group.traverse(object => {
        if ((object.isMesh || object.isLineSegments) && object.geometry) {
          object.geometry.dispose();
        }
        if (object.isLineSegments && object.material) {
          object.material.dispose();
        }
      });
    }

    function createTerrainChunk(chunkX, chunkZ) {
      const size = TERRAIN.chunkSize;
      const segments = TERRAIN.segments;
      const half = size * 0.5;
      const worldOriginX = chunkX * size + half;
      const worldOriginZ = chunkZ * size + half;
      const positions = [];
      const colors = [];
      const indices = [];
      const step = size / segments;

      for (let row = 0; row <= segments; row++) {
        for (let column = 0; column <= segments; column++) {
          const localX = -half + column * step;
          const localZ = -half + row * step;
          const worldX = worldOriginX + localX;
          const worldZ = worldOriginZ + localZ;
          const height = heightAt(worldX, worldZ);
          const slope = Math.max(
            Math.abs(heightAt(worldX + 1, worldZ) - heightAt(worldX - 1, worldZ)),
            Math.abs(heightAt(worldX, worldZ + 1) - heightAt(worldX, worldZ - 1))
          );
          const color = terrainColor(height, slope, worldX, worldZ);
          positions.push(localX, height, localZ);
          colors.push(color.r, color.g, color.b);
        }
      }

      for (let row = 0; row < segments; row++) {
        for (let column = 0; column < segments; column++) {
          const a = row * (segments + 1) + column;
          const b = a + 1;
          const d = (row + 1) * (segments + 1) + column;
          const c = d + 1;
          indices.push(a, d, b, b, d, c);
        }
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geometry.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geometry.setIndex(indices);
      geometry.computeVertexNormals();

      const mesh = new THREE.Mesh(
        geometry,
        new THREE.MeshStandardMaterial({
          vertexColors: true,
          roughness: 1,
          metalness: 0
        })
      );
      mesh.position.set(worldOriginX, 0, worldOriginZ);
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    }

    function chunkKey(chunkX, chunkZ) {
      return chunkX + "," + chunkZ;
    }

    function syncTerrainChunks() {
      const focusX = flyer ? flyer.position.x : camera.position.x;
      const focusZ = flyer ? flyer.position.z : camera.position.z;
      const centerX = Math.floor(focusX / TERRAIN.chunkSize);
      const centerZ = Math.floor(focusZ / TERRAIN.chunkSize);
      const needed = new Set();

      for (let dz = -TERRAIN.loadRadius; dz <= TERRAIN.loadRadius; dz++) {
        for (let dx = -TERRAIN.loadRadius; dx <= TERRAIN.loadRadius; dx++) {
          const chunkX = centerX + dx;
          const chunkZ = centerZ + dz;
          const key = chunkKey(chunkX, chunkZ);
          needed.add(key);
          if (!terrainChunks.has(key)) {
            terrainChunks.set(key, createTerrainChunk(chunkX, chunkZ));
          }
          if (!structureChunks.has(key)) {
            structureChunks.set(key, createStructuresChunk(chunkX, chunkZ));
          }
        }
      }

      for (const [key, mesh] of terrainChunks) {
        if (!needed.has(key)) {
          scene.remove(mesh);
          mesh.geometry.dispose();
          mesh.material.dispose();
          terrainChunks.delete(key);
        }
      }

      for (const [key, group] of structureChunks) {
        if (!needed.has(key)) {
          scene.remove(group);
          disposeStructureGroup(group);
          buildingHitboxes.delete(key);
          structureChunks.delete(key);
        }
      }
    }

    syncTerrainChunks();

    const FLYING_MATERIALS = {
      body: new THREE.MeshStandardMaterial({ color: 0xd8e3e4, roughness: 0.38, metalness: 0.62 }),
      dark: new THREE.MeshStandardMaterial({ color: 0x1c252a, roughness: 0.46, metalness: 0.7 }),
      glass: new THREE.MeshStandardMaterial({ color: 0x4cc2d8, roughness: 0.18, metalness: 0.35 }),
      light: new THREE.MeshStandardMaterial({
        color: 0xffd76a,
        emissive: 0x8d4f12,
        emissiveIntensity: 1.1,
        roughness: 0.3
      })
    };

    function createDrone() {
      const group = new THREE.Group();

      // Modello compatto ispirato a un drone sferico corazzato:
      // nessun elemento supera il diametro della sfera (0,68 unità).
      const shell = new THREE.Mesh(
        new THREE.SphereGeometry(0.34, 24, 18),
        FLYING_MATERIALS.body
      );
      shell.castShadow = true;
      shell.receiveShadow = true;
      group.add(shell);

      const frontRing = new THREE.Mesh(
        new THREE.TorusGeometry(0.16, 0.018, 8, 24),
        FLYING_MATERIALS.dark
      );
      frontRing.rotation.x = Math.PI * 0.5;
      frontRing.position.z = -0.2;
      group.add(frontRing);

      const sensor = new THREE.Mesh(
        new THREE.SphereGeometry(0.08, 16, 10),
        FLYING_MATERIALS.glass
      );
      sensor.position.set(0, 0.02, -0.27);
      sensor.castShadow = true;
      group.add(sensor);

      const beacon = new THREE.Mesh(
        new THREE.SphereGeometry(0.035, 10, 8),
        FLYING_MATERIALS.light
      );
      beacon.position.set(0, 0.02, -0.32);
      group.add(beacon);

      function addWing(side) {
        const wingGeometry = new THREE.BufferGeometry();
        wingGeometry.setAttribute("position", new THREE.Float32BufferAttribute([
          side * 0.09, 0.08, 0.12,
          side * 0.31, 0.055, 0.08,
          side * 0.32, 0.025, -0.14,
          side * 0.13, 0.04, -0.19
        ], 3));
        wingGeometry.setIndex([0, 1, 2, 0, 2, 3]);
        wingGeometry.computeVertexNormals();

        const wing = new THREE.Mesh(
          wingGeometry,
          new THREE.MeshStandardMaterial({
            color: 0x171d22,
            roughness: 0.58,
            metalness: 0.6,
            side: THREE.DoubleSide
          })
        );
        wing.castShadow = true;
        wing.receiveShadow = true;
        group.add(wing);

        const wingEdge = new THREE.Mesh(
          new THREE.BoxGeometry(0.23, 0.018, 0.018),
          FLYING_MATERIALS.dark
        );
        wingEdge.position.set(side * 0.205, 0.055, -0.055);
        wingEdge.rotation.y = side * 0.34;
        wingEdge.castShadow = true;
        group.add(wingEdge);

        const wingLight = new THREE.Mesh(
          new THREE.BoxGeometry(0.17, 0.009, 0.012),
          FLYING_MATERIALS.light
        );
        wingLight.position.set(side * 0.215, 0.046, -0.07);
        wingLight.rotation.y = side * 0.34;
        group.add(wingLight);
      }

      addWing(-1);
      addWing(1);

      function addCannon(side) {
        const mount = new THREE.Mesh(
          new THREE.CylinderGeometry(0.035, 0.045, 0.09, 8),
          FLYING_MATERIALS.dark
        );
        mount.rotation.x = Math.PI * 0.5;
        mount.position.set(side * 0.15, -0.11, -0.21);
        group.add(mount);

        const barrel = new THREE.Mesh(
          new THREE.CylinderGeometry(0.015, 0.022, 0.12, 8),
          FLYING_MATERIALS.dark
        );
        barrel.rotation.x = Math.PI * 0.5;
        barrel.position.set(side * 0.15, -0.11, -0.25);
        barrel.castShadow = true;
        group.add(barrel);

        const muzzle = new THREE.Mesh(
          new THREE.SphereGeometry(0.022, 8, 6),
          FLYING_MATERIALS.light
        );
        muzzle.position.set(side * 0.15, -0.11, -0.315);
        group.add(muzzle);
      }

      addCannon(-1);
      addCannon(1);

      return group;
    }

    function spawnClearance(x, z) {
      let nearest = Infinity;
      for (const hitboxes of buildingHitboxes.values()) {
        for (const hitbox of hitboxes) {
          const dx = x < hitbox.min.x ? hitbox.min.x - x : x > hitbox.max.x ? x - hitbox.max.x : 0;
          const dz = z < hitbox.min.z ? hitbox.min.z - z : z > hitbox.max.z ? z - hitbox.max.z : 0;
          nearest = Math.min(nearest, Math.hypot(dx, dz));
        }
      }
      return nearest;
    }

    function findSafeSpawn() {
      const probe = new THREE.Sphere();
      const center = new THREE.Vector3();
      let best = null;
      let bestClearance = -Infinity;

      // Cerca in tutta la zona già caricata, scegliendo il punto più lontano dagli edifici.
      for (let x = -112; x <= 112; x += 8) {
        for (let z = -112; z <= 112; z += 8) {
          const y = heightAt(x, z) + 110;
          center.set(x, y, z);
          probe.set(center, flyerHitboxRadius);
          let blocked = false;
          for (const hitboxes of buildingHitboxes.values()) {
            for (const hitbox of hitboxes) {
              if (probe.intersectsBox(hitbox)) {
                blocked = true;
                break;
              }
            }
            if (blocked) break;
          }
          if (!blocked && spawnClearance(x, z) > bestClearance) {
            bestClearance = spawnClearance(x, z);
            best = { x, y, z };
          }
        }
      }

      return best || { x: -112, y: heightAt(-112, -112) + 110, z: -112 };
    }

    // Il drone giocabile è un controller invisibile: conserva posizione, rotazione,
    // hitbox e fisica, senza trascinare con sé il modello estetico.
    flyer = new THREE.Group();
    const safeSpawn = findSafeSpawn();
    flyer.position.set(safeSpawn.x, safeSpawn.y, safeSpawn.z);
    flyer.userData.hitbox = new THREE.Sphere();
    scene.add(flyer);

    // Modello statico di osservazione: nasce davanti alla camera iniziale
    // e resta fermo nel mondo mentre il drone gli ruota e vola attorno.
    const droneModel = createDrone();
    droneModel.position.copy(flyer.position);
    droneModel.rotation.y = yaw;
    scene.add(droneModel);

    // Nessun albero: la scena resta una metropoli urbana compatta.

    function createCloud(x, y, z, scale = 1) {
      const cloud = new THREE.Group();
      const material = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.84 });
      const parts = [
        [-1.5, 0, 0, 1.25],
        [0, 0.25, 0, 1.6],
        [1.55, 0, 0.1, 1.1],
        [0.65, -0.15, 0.35, 1.25]
      ];
      for (const [px, py, pz, size] of parts) {
        const puff = new THREE.Mesh(new THREE.SphereGeometry(size * scale, 16, 12), material);
        puff.position.set(px * scale, py * scale, pz * scale);
        cloud.add(puff);
      }
      cloud.position.set(x, y, z);
      scene.add(cloud);
    }

    createCloud(-27, 21, -70, 2.2);
    createCloud(32, 25, -105, 2.7);
    createCloud(2, 30, -145, 3.2);

    const keys = new Set();
    let yaw = 0;
    let pitch = 0;
    const cameraPosition = new THREE.Vector3();
    const cameraLookTarget = new THREE.Vector3();
    const flightDirection = new THREE.Vector3(0, 0, -1);
    const bounceVelocity = new THREE.Vector3();
    const bounceTilt = new THREE.Vector3();
    let started = false;
    const clock = new THREE.Clock();
    const mobileMove = { x: 0, y: 0 };
    let joystickPointer = null;
    let lookPointer = null;
    let previousLookX = 0;
    let previousLookY = 0;
    let mouseLookPointer = null;

    function requestPointerLockSafely() {
      if (!matchMedia("(pointer: fine)").matches || document.pointerLockElement === renderer.domElement) {
        return;
      }
      try {
        const request = renderer.domElement.requestPointerLock?.();
        request?.catch?.(() => {
          // Alcuni browser incorporati rifiutano il pointer lock: resta attivo il drag fallback.
        });
      } catch {
        // Il drag sul canvas continua a funzionare anche senza pointer lock.
      }
    }

    function enterImmersiveMode() {
      // Il fullscreen non viene più richiesto automaticamente.
      // Il drag fallback resta disponibile se il browser rifiuta il pointer lock.
      requestPointerLockSafely();
    }

    function beginGame() {
      started = true;
      startScreen.classList.add("hidden");
      enterImmersiveMode();
    }

    startButton.addEventListener("click", beginGame);
    renderer.domElement.addEventListener("click", () => {
      if (!started) {
        beginGame();
      } else {
        requestPointerLockSafely();
      }
    });

    addEventListener("keydown", event => {
      keys.add(event.key.toLowerCase());
      if (["w", "a", "s", "d", "arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
    });
    addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));

    addEventListener("mousemove", event => {
      if (document.pointerLockElement !== renderer.domElement || !started) return;
      yaw -= event.movementX * 0.0022;
      pitch -= event.movementY * 0.0022;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
    });

    renderer.domElement.addEventListener("pointerdown", event => {
      if (!started || !matchMedia("(pointer: fine)").matches) return;
      mouseLookPointer = event.pointerId;
      previousLookX = event.clientX;
      previousLookY = event.clientY;
      renderer.domElement.setPointerCapture(event.pointerId);
    });

    renderer.domElement.addEventListener("pointermove", event => {
      // Fallback per browser che non consentono il pointer lock:
      // clicca e trascina sul canvas per guardarti intorno.
      if (!started || event.pointerId !== mouseLookPointer || document.pointerLockElement === renderer.domElement) return;
      yaw -= (event.clientX - previousLookX) * 0.006;
      pitch -= (event.clientY - previousLookY) * 0.006;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
      previousLookX = event.clientX;
      previousLookY = event.clientY;
    });

    function stopMouseLooking(event) {
      if (event.pointerId !== mouseLookPointer) return;
      mouseLookPointer = null;
      if (renderer.domElement.hasPointerCapture?.(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    }

    renderer.domElement.addEventListener("pointerup", stopMouseLooking);
    renderer.domElement.addEventListener("pointercancel", stopMouseLooking);

    function updateJoystick(event) {
      const rect = joystick.getBoundingClientRect();
      const radius = rect.width * 0.5;
      let dx = event.clientX - (rect.left + radius);
      let dy = event.clientY - (rect.top + radius);
      const distance = Math.hypot(dx, dy);
      if (distance > radius) {
        dx = dx / distance * radius;
        dy = dy / distance * radius;
      }
      mobileMove.x = dx / radius;
      mobileMove.y = dy / radius;
      joystickKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
    }

    function resetJoystick() {
      joystickPointer = null;
      mobileMove.x = 0;
      mobileMove.y = 0;
      joystickKnob.style.transform = "translate(-50%, -50%)";
    }

    joystick.addEventListener("pointerdown", event => {
      if (!started) beginGame();
      joystickPointer = event.pointerId;
      joystick.setPointerCapture(event.pointerId);
      updateJoystick(event);
    });
    joystick.addEventListener("pointermove", event => {
      if (event.pointerId === joystickPointer) updateJoystick(event);
    });
    joystick.addEventListener("pointerup", resetJoystick);
    joystick.addEventListener("pointercancel", resetJoystick);

    lookArea.addEventListener("pointerdown", event => {
      if (!started) beginGame();
      lookPointer = event.pointerId;
      previousLookX = event.clientX;
      previousLookY = event.clientY;
      lookArea.setPointerCapture(event.pointerId);
    });
    lookArea.addEventListener("pointermove", event => {
      if (event.pointerId !== lookPointer) return;
      yaw -= (event.clientX - previousLookX) * 0.009;
      pitch -= (event.clientY - previousLookY) * 0.009;
      pitch = THREE.MathUtils.clamp(pitch, -1.35, 1.35);
      previousLookX = event.clientX;
      previousLookY = event.clientY;
    });
    function stopLooking(event) {
      if (event.pointerId === lookPointer) lookPointer = null;
    }
    lookArea.addEventListener("pointerup", stopLooking);
    lookArea.addEventListener("pointercancel", stopLooking);

    function shootProjectile() {
      if (!flyer) return;

      const shot = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 8, 6),
        new THREE.MeshBasicMaterial({ color: 0xffd45c })
      );
      shot.position.copy(flyer.position).addScaledVector(flightDirection, 1.35);
      shot.position.y += 0.1;
      scene.add(shot);

      projectiles.push({
        mesh: shot,
        velocity: flightDirection.clone().multiplyScalar(42),
        life: 2.2,
        hitbox: new THREE.Box3()
      });
    }

    function updateProjectiles(delta) {
      for (let index = projectiles.length - 1; index >= 0; index--) {
        const projectile = projectiles[index];
        projectile.life -= delta;
        projectile.mesh.position.addScaledVector(projectile.velocity, delta);
        projectile.hitbox.setFromCenterAndSize(
          projectile.mesh.position,
          new THREE.Vector3(0.24, 0.24, 0.24)
        );

        let hitBuilding = false;
        for (const hitboxes of buildingHitboxes.values()) {
          for (const hitbox of hitboxes) {
            if (projectile.hitbox.intersectsBox(hitbox)) {
              hitBuilding = true;
              break;
            }
          }
          if (hitBuilding) break;
        }

        if (projectile.life <= 0 || hitBuilding) {
          scene.remove(projectile.mesh);
          projectile.mesh.geometry.dispose();
          projectile.mesh.material.dispose();
          projectiles.splice(index, 1);
        }
      }
    }

    function updateFlyerHitbox() {
      if (!flyer?.userData.hitbox) return;
      flyer.userData.hitbox.set(flyer.position, flyerHitboxRadius);
    }

    function findFlyerBuildingCollision() {
      if (!flyer?.userData.hitbox) return null;

      const closestPoint = new THREE.Vector3();
      const separation = new THREE.Vector3();
      for (const hitboxes of buildingHitboxes.values()) {
        for (const hitbox of hitboxes) {
          if (!flyer.userData.hitbox.intersectsBox(hitbox)) continue;

          closestPoint.set(
            THREE.MathUtils.clamp(flyer.position.x, hitbox.min.x, hitbox.max.x),
            THREE.MathUtils.clamp(flyer.position.y, hitbox.min.y, hitbox.max.y),
            THREE.MathUtils.clamp(flyer.position.z, hitbox.min.z, hitbox.max.z)
          );
          separation.copy(flyer.position).sub(closestPoint);

          if (separation.lengthSq() > 0.000001) {
            const distance = separation.length();
            return {
              normal: separation.multiplyScalar(1 / distance),
              penetration: Math.max(0, flyerHitboxRadius - distance)
            };
          }

          // Se il centro è dentro l'AABB, scegli la faccia con penetrazione minore.
          const distances = [
            { axis: "x", distance: flyer.position.x - hitbox.min.x, sign: 1 },
            { axis: "x", distance: hitbox.max.x - flyer.position.x, sign: -1 },
            { axis: "y", distance: flyer.position.y - hitbox.min.y, sign: 1 },
            { axis: "y", distance: hitbox.max.y - flyer.position.y, sign: -1 },
            { axis: "z", distance: flyer.position.z - hitbox.min.z, sign: 1 },
            { axis: "z", distance: hitbox.max.z - flyer.position.z, sign: -1 }
          ];
          distances.sort((a, b) => a.distance - b.distance);
          const normal = new THREE.Vector3();
          normal[distances[0].axis] = distances[0].sign;
          return {
            normal,
            penetration: flyerHitboxRadius + distances[0].distance
          };
        }
      }
      return null;
    }

    function moveFlyer(delta) {
      if (!started || !flyer) return;

      let throttle = 0;
      let pitchInput = 0;
      let turnInput = 0;

      if (keys.has("w")) throttle = 1;
      if (keys.has("s")) throttle = -0.35;
      if (keys.has("a")) turnInput -= 1;
      if (keys.has("d")) turnInput += 1;
      if (keys.has("arrowup")) pitchInput += 1;
      if (keys.has("arrowdown")) pitchInput -= 1;

      // Joystick mobile: avanti accelera e spara, indietro oltre metà raggio
      // disattiva l'acceleratore ma continua a sparare da fermo.
      const joystickReverse = joystickPointer !== null && mobileMove.y > 0.5;
      const stickShooting = joystickPointer !== null && Math.abs(mobileMove.y) > 0.5;
      if (joystickPointer !== null) {
        throttle = joystickReverse ? 0 : 1;
      }

      shotCooldown = Math.max(0, shotCooldown - delta);
      if ((stickShooting || keys.has(" ")) && shotCooldown <= 0) {
        shootProjectile();
        shotCooldown = 0.18;
      }

      yaw += turnInput * delta * 1.2;
      pitch += pitchInput * delta * 0.85;
      pitch = THREE.MathUtils.clamp(pitch, -0.8, 0.8);

      const speed = throttle < 0 ? 5.5 : 13 * throttle;
      flightDirection.set(
        -Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        -Math.cos(yaw) * Math.cos(pitch)
      );

      const movementVelocity = flightDirection.clone().multiplyScalar(speed);
      flyer.position.addScaledVector(movementVelocity, delta);
      flyer.position.addScaledVector(bounceVelocity, delta);
      bounceVelocity.multiplyScalar(Math.exp(-3.8 * delta));
      bounceTilt.multiplyScalar(Math.exp(-5.5 * delta));

      const groundHeight = heightAt(flyer.position.x, flyer.position.z);
      flyer.position.y = THREE.MathUtils.clamp(
        flyer.position.y,
        groundHeight + 4.5,
        140
      );

      // Carica il chunk eventualmente attraversato prima di testare la collisione.
      syncTerrainChunks();
      updateFlyerHitbox();
      const collision = findFlyerBuildingCollision();
      if (collision) {
        // Corregge solo la penetrazione reale: il drone resta aderente alla
        // superficie e non viene arretrato con un margine navigabile aggiuntivo.
        flyer.position.addScaledVector(collision.normal, collision.penetration + 0.001);

        // L'impulso segue la normale della superficie, quindi tiene conto
        // dell'angolo reale senza annullare l'accelerazione del pilota.
        const incomingVelocity = movementVelocity.clone().add(bounceVelocity);
        const impactSpeed = Math.max(0, -incomingVelocity.dot(collision.normal));
        const reboundSpeed = Math.min(6.5, Math.max(2.8, impactSpeed * 0.72));
        bounceVelocity.copy(collision.normal).multiplyScalar(reboundSpeed);
        flyer.position.addScaledVector(bounceVelocity, delta);

        // Tilt elastico di 3–7 gradi: asse Y per la deviazione laterale,
        // asse X quando l'urto avviene durante una salita/discesa.
        const localNormal = collision.normal.clone().applyAxisAngle(
          new THREE.Vector3(0, 1, 0),
          -yaw
        );
        const normalizedImpact = THREE.MathUtils.clamp(
          impactSpeed / Math.max(1, movementVelocity.length()),
          0,
          1
        );
        const tilt = THREE.MathUtils.degToRad(3 + normalizedImpact * 4);
        const verticalRatio = THREE.MathUtils.clamp(
          Math.abs(movementVelocity.y) / Math.max(1, movementVelocity.length()),
          0,
          1
        );
        bounceTilt.y = THREE.MathUtils.clamp(localNormal.x * tilt, -tilt, tilt);
        bounceTilt.x = -Math.sign(movementVelocity.y) * tilt * verticalRatio;
        updateFlyerHitbox();
      }

      flyer.rotation.set(pitch + bounceTilt.x, yaw + bounceTilt.y, bounceTilt.z);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      moveFlyer(delta);
      updateProjectiles(delta);

      if (flyer) {
        // La camera segue il drone giocabile; il modello statico resta nel mondo
        // e può essere osservato volandogli e ruotandogli attorno.
        cameraPosition.set(0, 0.42, 1.15).applyQuaternion(flyer.quaternion);
        cameraPosition.add(flyer.position);
        cameraLookTarget.copy(flyer.position).addScaledVector(flightDirection, 1.4);
        cameraLookTarget.y += 0.05;
        camera.position.copy(cameraPosition);
        camera.lookAt(cameraLookTarget);
      }

      renderer.render(scene, camera);
    }

    addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    animate();
  </script>
</body>
</html>
