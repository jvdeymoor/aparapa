<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>aparapa.com</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #101114;
      color: #fff;
    }
    main { width: min(92%, 720px); text-align: center; }
    h1 { margin-bottom: 2rem; font-size: clamp(2rem, 7vw, 4rem); }
    nav { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1rem; }
    a {
      padding: 1.5rem;
      border: 2px solid #fff;
      border-radius: 1rem;
      color: inherit;
      font-size: 1.25rem;
      font-weight: 700;
      text-decoration: none;
      transition: background .15s, color .15s, transform .15s;
    }
    a:hover, a:focus-visible { background: #fff; color: #101114; transform: translateY(-2px); }
  </style>
</head>
<body>
  <main>
    <h1>aparapa.com</h1>
    <nav aria-label="Progetti">
      <a href="./progetto27/">Progetto27</a>
      <a href="./BEAT-O-GATO/">BEAT-O-GATO</a>
      <a href="./upika/">UPIKA</a>
    </nav>
  </main>
</body>
</html>
